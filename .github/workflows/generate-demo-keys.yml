name: Generate demo keys

on:
  workflow_dispatch:
  schedule:
    # Runs every 30 minutes.
    # GitHub Actions is scheduled, not truly always-on.
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate demo keys
        run: python scripts/generate_keys.py

      - name: Commit updated demo keys
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update scheduled demo keys"
          file_pattern: data/generated-keys.json
